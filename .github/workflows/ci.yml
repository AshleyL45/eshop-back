name: CI Pipeline for Spring Boot

on:
  push:
    branches-ignore:
      - staging
      - production
      - development

  pull_request:
    branches:
      - development
      - staging
      - production

jobs:

  unit-tests:
    name: 🧪 Unit Tests
    runs-on: ubuntu-latest

    env:
      SPRING_PROFILES_ACTIVE: integration
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      JWT_EXPIRATION_MS: ${{ secrets.JWT_EXPIRATION }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven

      - name: Run unit tests
        run: ./mvnw test -Punit-tests



  integration-tests:
    name: 🔗 Integration Tests
    runs-on: ubuntu-latest

    env:
      SPRING_PROFILES_ACTIVE: integration
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      JWT_EXPIRATION_MS: ${{ secrets.JWT_EXPIRATION }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Start Docker (for Testcontainers if needed)
        run: sudo service docker start

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven

      - name: Run integration tests
        run: ./mvnw test -Pintegration-tests



  e2e-tests:
    name: 🚀 E2E Tests
    runs-on: ubuntu-latest

    env:
      SPRING_PROFILES_ACTIVE: integration
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      JWT_EXPIRATION_MS: ${{ secrets.JWT_EXPIRATION }}

    if: >
      github.event_name == 'pull_request' &&
      (
        (github.base_ref == 'staging' && github.head_ref == 'development') ||
        (github.base_ref == 'production' && github.head_ref == 'staging')
      )

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Run E2E tests
        run: ./mvnw test -Pe2e-tests

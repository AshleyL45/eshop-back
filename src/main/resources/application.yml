spring:
  application:
    name: eshop_api

  profiles:
    active: development

  config:
    import:
      - "configtree:./"

jpa:
  hibernate:
    ddl-auto: update
  show-sql: true
  properties:
    hibernate:
      format_sql: true
  defer-datasource-initialization: true

sql:
  init:
    mode: never

mvc:
  throw-exception-if-no-handler-found: true

web:
  resources:
    add-mappings: false

cors:
  allowedOrigins: ${CLIENT_URL_DEV}

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION_MS}

logging:
  level:
    org.springframework.web: debug
